name: Motor OD Claim Adjudicator CI/CD

on:
  push:
    branches:
      - master
      - main
      - develop

  pull_request:
    branches:
      - master
      - main


jobs:

  # =========================================================
  # 1. CODE QUALITY
  # =========================================================

  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check .


  # =========================================================
  # 2. UNIT TESTING
  # =========================================================

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGCHAIN_TRACING_V2: "false"
      PYTHONPATH: .

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install spaCy model
        run: |
          python -m spacy download en_core_web_sm

      - name: Run Pytest
        run: |
          python -m pytest tests/ -v


  # =========================================================
  # 3. APPLICATION VALIDATION
  # =========================================================

  validate:
    name: Application Validation
    runs-on: ubuntu-latest
    needs: test

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGCHAIN_TRACING_V2: "false"
      PYTHONPATH: .

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install spaCy model
        run: |
          python -m spacy download en_core_web_sm

      # -----------------------------------------------------
      # Syntax validation
      # -----------------------------------------------------

      - name: Python syntax validation
        run: |
          python -m compileall -q app

      # -----------------------------------------------------
      # Schema validation
      # -----------------------------------------------------

      - name: Validate Pydantic schemas
        run: |
          python -c "
          from app.schemas.claim import MotorClaim, GarageEstimateItem

          item = GarageEstimateItem(
              part_name='Front Bumper',
              category='PLASTIC',
              claimed_amount=4500
          )

          claim = MotorClaim(
              vehicle_number='TN01AB1234',
              accident_description='Vehicle hit a road divider.',
              claim_amount=4500,
              garage_estimate=[item]
          )

          assert claim.claim_amount == 4500
          assert len(claim.garage_estimate) == 1

          print('Schema validation successful')
          "

      # -----------------------------------------------------
      # IMT calculator validation
      # -----------------------------------------------------

      - name: Validate IMT calculator
        run: |
          python -c "
          from app.tools.imt_calculator import (
              get_depreciation,
              calculate_approved_amount,
          )

          depreciation = get_depreciation(
              vehicle_age='2 - 5 Years',
              category='METAL',
              zero_dep='No'
          )

          assert depreciation == 25.0

          approved = calculate_approved_amount(
              claimed_amount=10000,
              depreciation_percentage=25
          )

          assert approved == 7500.0

          print('IMT calculator validation successful')
          "

      # -----------------------------------------------------
      # Prompt validation
      # -----------------------------------------------------

            # -----------------------------------------------------
      # Prompt validation
      # -----------------------------------------------------

      - name: Validate adjudication prompt
        run: |
          python -c "
          from app.agent.prompt import build_adjudication_prompt

          prompt = build_adjudication_prompt(
              claim_text='Vehicle hit a road divider.',
              policy_context='Accidental damage is covered.',
              claim_history='NONE'
          )

          assert prompt
          assert len(prompt) > 0

          print('Prompt validation successful')
          "

      # -----------------------------------------------------
      # LangGraph validation
      # -----------------------------------------------------

      - name: Validate LangGraph
        run: |
          python -c "
          from app.agent.graph import build_claim_graph

          graph = build_claim_graph()

          assert graph is not None

          print('LangGraph validation successful')
          "

      # -----------------------------------------------------
      # FastAPI validation
      # -----------------------------------------------------

      - name: Validate FastAPI application
        run: |
          python -c "
          from app.main import app

          assert app is not None

          routes = [
              route.path
              for route in app.routes
          ]

          assert '/health' in routes
          assert '/api/v1/claims/adjudicate' in routes

          print('FastAPI validation successful')
          "


  # =========================================================
  # 4. DOCKER BUILD & CONTAINER VERIFICATION
  # =========================================================

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: validate

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Verify Dockerfile
      # -----------------------------------------------------

      - name: Verify Dockerfile
        run: |
          test -f Dockerfile
          echo "Dockerfile found successfully."


      # -----------------------------------------------------
      # Build Docker image
      # -----------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t motor-od-claim-adjudicator:${{ github.sha }} \
            .


      # -----------------------------------------------------
      # Verify Docker image
      # -----------------------------------------------------

      - name: Verify Docker image
        run: |
          docker image inspect \
            motor-od-claim-adjudicator:${{ github.sha }}

          echo "Docker image built successfully."


      # -----------------------------------------------------
      # Start Docker container
      # -----------------------------------------------------

      - name: Start Docker container
        run: |
          docker run -d \
            --name motor-od-claim-adjudicator \
            -p 8000:8000 \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            motor-od-claim-adjudicator:${{ github.sha }}


      # -----------------------------------------------------
      # Wait for startup
      # -----------------------------------------------------

      - name: Wait for application startup
        run: |
          echo "Waiting for FastAPI application..."

          sleep 10


      # -----------------------------------------------------
      # Check container status
      # -----------------------------------------------------

      - name: Check Docker container
        run: |
          echo "======================================"
          echo "DOCKER CONTAINER STATUS"
          echo "======================================"

          docker ps -a

          echo ""
          echo "======================================"
          echo "DOCKER CONTAINER LOGS"
          echo "======================================"

          docker logs motor-od-claim-adjudicator || true


      # -----------------------------------------------------
      # Verify health endpoint
      # -----------------------------------------------------

      - name: Verify health endpoint
        run: |
          echo "Checking FastAPI health endpoint..."

          curl \
            --verbose \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            http://localhost:8000/health


      # -----------------------------------------------------
      # Verify API endpoint exists
      # -----------------------------------------------------

      - name: Verify API endpoint
        run: |
          echo "Checking API endpoint..."

          curl \
            --verbose \
            http://localhost:8000/docs


      # -----------------------------------------------------
      # Show logs
      # -----------------------------------------------------

      - name: Show container logs
        if: always()
        run: |
          echo "======================================"
          echo "FINAL CONTAINER LOGS"
          echo "======================================"

          docker logs motor-od-claim-adjudicator || true


      # -----------------------------------------------------
      # Stop container
      # -----------------------------------------------------

      - name: Stop Docker container
        if: always()
        run: |
          docker stop motor-od-claim-adjudicator || true
          docker rm motor-od-claim-adjudicator || true